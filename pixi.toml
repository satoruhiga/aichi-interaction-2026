[workspace]
name = "aichi-interaction-2026"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64"]

[activation.env]
PYTHONNOUSERSITE = "1"

[dependencies]
python = "3.11.*"
git = ">=2.56.0,<3"
git-lfs = ">=3.8.1,<4"
numpy = "<2"
py-opencv = ">=4.12.0,<5"
pyopengl = ">=3.1.9,<4"
pyglfw = ">=2.9.0,<3"
rich = ">=14.2.0,<15"
# cpu_* builds: Vulkan on Windows, Metal on macOS (no CUDA toolkit).
"llama.cpp" = { version = ">=12004", build = "cpu_*" }
platformio = ">=6.2.0,<7"

[pypi-dependencies]
mediapipe = ">=0.10.21"
websockets = ">=17.4, <18"
sounddevice = ">=0.5.6, <0.6"

[target.win-64.pypi-dependencies]
spoutgl = ">=0.1.1"

[target.osx-arm64.pypi-dependencies]
syphon-python = ">=0.2.0"
